name: Unified Android App CI

on:
  push:
    branches:
      - "feat/**"
  pull_request:
    branches:
      - android-boot-wip
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test updater and build unified Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout source and nested submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Run updater tests and assemble debug APK
        working-directory: android
        run: |
          set -Eeuo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon testDebugUnitTest assembleDebug -PkytyBundleDrivers=false

      - name: Verify unified package identity and updater provider
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ps5gamehub.android'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -F "android.permission.REQUEST_INSTALL_PACKAGES"
          sha256sum "$APK"

      - name: Upload debug integration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ps5-game-hub-unified-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
