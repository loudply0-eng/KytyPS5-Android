name: Full Native Android Debug Integration

# Builds the ARM64 emulator libraries and a debug-only APK.
# This workflow deliberately does not sign or publish releases: production updates
# must be built in PS5-Game-Hub-Android with its established signing identity.
on:
  push:
    branches:
      - android-boot-wip
      - "feature/**"
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - android-boot-wip
  workflow_dispatch:

concurrency:
  group: full-native-android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    name: Build ARM64 emulator and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools ccache

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK and NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: ccache-android-

      - name: FFmpeg cache
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: _Build/ffmpeg-android/install
          key: ffmpeg-android-${{ hashFiles('scripts/android/build-ffmpeg-android.sh') }}-${{ env.NDK_VERSION }}

      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK }}
        run: bash scripts/android/build-ffmpeg-android.sh "$PWD/_Build/ffmpeg-android"

      - name: Configure native emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake -S . -B _Build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DCMAKE_BUILD_TYPE=Release \
            -DKYTY_GUEST_CPU_FEX=ON -DKYTY_BUILD_LAUNCHER=OFF \
            -DFFMPEG_PREBUILT_DIR="$PWD/_Build/ffmpeg-android/install" \
            -DKYTY_BUILD_ORIGIN=Fork -DKYTY_BUILD_REPOSITORY="$GITHUB_REPOSITORY" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build native emulator
        run: |
          set -Eeuo pipefail
          ccache --max-size=3G
          ninja -C _Build/android kyty_emulator
          ccache --show-stats

      - name: Stage native libraries
        shell: bash
        run: |
          set -Eeuo pipefail
          ST="$RUNNER_TEMP/native"
          mkdir -p "$ST/3rdparty/SDL3" "$ST/3rdparty/libadrenotools/src/hook"
          STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-debug -o "$ST/libmain.so" _Build/android/libmain.so
          cp _Build/android/3rdparty/SDL3/libSDL3.so "$ST/3rdparty/SDL3/"
          cp _Build/android/3rdparty/libadrenotools/src/hook/*.so "$ST/3rdparty/libadrenotools/src/hook/"
          test -s "$ST/libmain.so"
          test -s "$ST/3rdparty/SDL3/libSDL3.so"
          ls -la "$ST" "$ST/3rdparty/SDL3" "$ST/3rdparty/libadrenotools/src/hook"

      - name: Unit tests and debug APK
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            -PkytyNativeDir="$RUNNER_TEMP/native" \
            -PappVersionCode=1 \
            -PappVersion=0.1.0

      - name: Verify APK identity and native engine payload
        working-directory: android
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ps5gamehub.android'"
          for library in libmain.so libSDL3.so libhook_impl.so libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so; do
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" list "$APK" | grep -Fx "lib/arm64-v8a/$library"
          done
          sha256sum "$APK"

      - name: Upload full-native debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-game-hub-full-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
